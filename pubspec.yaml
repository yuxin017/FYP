name: collaborative_asg
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: 2.2.3

  # Firebase
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.8.0
  cloud_functions: ^6.0.6
  firebase_storage: ^13.6.1

  # Authentication
  google_sign_in: ^7.2.0
  local_auth: 3.0.2

  # HTTP
  http: ^1.6.0
  http_parser: ^4.1.2

  # Image & File
  image_picker: ^1.2.4
  image_cropper: ^12.2.1
  file_picker: ^12.1.2

  # Location & Map
  geolocator: ^14.0.3
  google_navigation_flutter: ^0.10.0
  latlong2: ^0.9.1
  flutter_map: ^8.3.2
  situm_flutter: 3.27.51

  # Other App Features
  flutter_tts: ^4.2.5
  flutter_local_notifications: ^19.5.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2

  # Reports & Analytics
  fl_chart: ^1.1.1
  pdf: ^3.11.3
  printing: ^5.14.2
  image: 4.9.2
  archive: 4.0.9
  qr_flutter: 4.1.0
  mobile_scanner: 7.1.3
  crypto: 3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

dependency_overrides:
  firebase_core_web: 3.10.0

flutter:
  # The project ships visitor mobile apps and browser-based admin/kiosk screens.
  # Desktop-native plugin symlinks should not require Windows Developer Mode.
  config:
    enable-web: true
    enable-windows-desktop: false
    enable-linux-desktop: false
    enable-macos-desktop: false
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/ticketing/
    - assets/images/admin/
    - assets/images/rewards/
    - assets/images/support/
    - assets/icons/navigation/
